name: lockstep-tickets

services:
  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${LOCKSTEP_DB_NAME:-lockstep}
      POSTGRES_USER: ${LOCKSTEP_DB_USER:-lockstep_app}
      POSTGRES_PASSWORD: ${LOCKSTEP_DB_PASSWORD:-lockstep-local-only}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/${LOCKSTEP_DB_NAME:-lockstep}
      DB_USERNAME: ${LOCKSTEP_DB_USER:-lockstep_app}
      DB_PASSWORD: ${LOCKSTEP_DB_PASSWORD:-lockstep-local-only}
      SPRING_PROFILES_ACTIVE: ${LOCKSTEP_SPRING_PROFILES_ACTIVE:-}
      LOCKSTEP_DEMO_CUSTOMER_EMAIL: ${LOCKSTEP_DEMO_CUSTOMER_EMAIL:-customer@lockstep.test}
      LOCKSTEP_DEMO_CUSTOMER_PASSWORD: ${LOCKSTEP_DEMO_CUSTOMER_PASSWORD:-}
      LOCKSTEP_DEMO_ADMIN_EMAIL: ${LOCKSTEP_DEMO_ADMIN_EMAIL:-admin@lockstep.test}
      LOCKSTEP_DEMO_ADMIN_PASSWORD: ${LOCKSTEP_DEMO_ADMIN_PASSWORD:-}
      LOCKSTEP_TRUSTED_PROXY_CIDRS: ${LOCKSTEP_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      LOCKSTEP_AUTH_COOKIE_SECURE: ${LOCKSTEP_AUTH_COOKIE_SECURE:-false}
      LOCKSTEP_PAYMENT_RECONCILIATION_ENABLED: ${LOCKSTEP_PAYMENT_RECONCILIATION_ENABLED:-true}
      LOCKSTEP_PAYMENT_RECONCILIATION_STALE_AFTER: ${LOCKSTEP_PAYMENT_RECONCILIATION_STALE_AFTER:-PT30S}
      LOCKSTEP_PAYMENT_RECONCILIATION_INTERVAL: ${LOCKSTEP_PAYMENT_RECONCILIATION_INTERVAL:-PT30S}
      LOCKSTEP_PAYMENT_RECONCILIATION_INITIAL_DELAY: ${LOCKSTEP_PAYMENT_RECONCILIATION_INITIAL_DELAY:-PT30S}
      LOCKSTEP_PAYMENT_RECONCILIATION_BATCH_SIZE: ${LOCKSTEP_PAYMENT_RECONCILIATION_BATCH_SIZE:-50}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCKSTEP_BACKEND_PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    restart: unless-stopped

volumes:
  postgres-data:

