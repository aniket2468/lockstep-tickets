name: lockstep-tickets

services:
  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${LOCKSTEP_DB_NAME:-lockstep}
      POSTGRES_USER: ${LOCKSTEP_DB_USER:-lockstep_app}
      POSTGRES_PASSWORD: ${LOCKSTEP_DB_PASSWORD:-lockstep-local-only}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/${LOCKSTEP_DB_NAME:-lockstep}
      DB_USERNAME: ${LOCKSTEP_DB_USER:-lockstep_app}
      DB_PASSWORD: ${LOCKSTEP_DB_PASSWORD:-lockstep-local-only}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCKSTEP_BACKEND_PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    restart: unless-stopped

volumes:
  postgres-data:

