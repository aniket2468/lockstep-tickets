debug: false

spring:
  application:
    name: lockstep-tickets
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
      minimum-idle: 1
      schema: lockstep
      validation-timeout: 1000
  flyway:
    clean-disabled: true
    create-schemas: true
    default-schema: lockstep
    schemas: lockstep
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: never
      show-details: never

lockstep:
  authentication:
    session-ttl: ${LOCKSTEP_SESSION_TTL:PT30M}
    throttle-window: ${LOCKSTEP_LOGIN_THROTTLE_WINDOW:PT15M}
    throttle-duration: ${LOCKSTEP_LOGIN_THROTTLE_DURATION:PT15M}
    account-max-failures: ${LOCKSTEP_LOGIN_ACCOUNT_MAX_FAILURES:5}
    ip-max-failures: ${LOCKSTEP_LOGIN_IP_MAX_FAILURES:30}
  cors:
    allowed-origins: ${LOCKSTEP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  demo:
    customer-email: ${LOCKSTEP_DEMO_CUSTOMER_EMAIL:customer@lockstep.test}
    customer-password: ${LOCKSTEP_DEMO_CUSTOMER_PASSWORD:}
    admin-email: ${LOCKSTEP_DEMO_ADMIN_EMAIL:admin@lockstep.test}
    admin-password: ${LOCKSTEP_DEMO_ADMIN_PASSWORD:}

